# Jeder Merge nach main wird ein Release: der Windows-Installer (Bau samt
# Installations- und Update-Probe), das Docker-Abbild (Rauchtest, dann amd64
# + arm64 nach GHCR), zuletzt das GitHub-Release vX.Y.Z mit der Setup-Exe und
# ihrer Pruefsumme. Die Nummer steht nur in nebenkostenfix/abrechnung_version.py.
# Am Release haengt ausserdem das signierte update.json; daraus liest die App,
# ob es etwas Neues gibt (NK-175). Ohne Secret UPDATE_SCHLUESSEL kein Release.
# Danach geht die MSIX als Einreichung in den Microsoft Store (Job store).
# Die Tests laufen nicht noch einmal: main nimmt nur Pull Requests an, die
# aktuell und gruen sind, der gemergte Stand ist also der gepruefte. Ein
# Commit ohne gemergten Pull Request wird deshalb nicht veroeffentlicht.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  ABBILD: ghcr.io/nerbry72/nebenkostenfix

jobs:
  version:
    name: Versionsnummer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      wert: ${{ steps.v.outputs.wert }}
      minor: ${{ steps.v.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Nur gemergte Pull Requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
          if [ "$n" = 0 ]; then
            echo "::error::$GITHUB_SHA stammt aus keinem gemergten Pull Request. Ungeprueft wird nichts veroeffentlicht."
            exit 1
          fi
      - id: v
        run: |
          v=$(python3 -c "from nebenkostenfix.abrechnung_version import SOFTWARE_VERSION as v; print(v)")
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::SOFTWARE_VERSION '$v' ist keine Nummer x.y.z"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error file=nebenkostenfix/abrechnung_version.py::v$v ist schon veroeffentlicht. SOFTWARE_VERSION anheben."
            exit 1
          fi
          # Ohne Release-Notizen bricht der Release hier ab, nicht erst nach
          # dem Bau: 0.16.0 ging ohne sie hinaus und der Release-Text bestand
          # danach aus der Installationsanleitung und einer PR-Titelzeile.
          if [ ! -s "docs/release-notizen/$v.md" ]; then
            echo "::error::docs/release-notizen/$v.md fehlt oder ist leer. Was ist neu, was ist behoben? Vorlage: docs/release-notizen/LIESMICH.md"
            exit 1
          fi
          echo "wert=$v" >> "$GITHUB_OUTPUT"
          # 0.17.3 -> 0.17: wer bei einer Reihe bleiben will, bekommt ihre Patches ohne Handarbeit.
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "## NebenkostenFix $v" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      nur_paket: true

  docker:
    name: Docker-Abbild
    needs: [version, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.wert }}
      MINOR: ${{ needs.version.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rauchtest (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nebenkostenfix:probe
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Abbild starten und /api/health abfragen
        run: |
          mkdir -p probe && sudo chown 1000:1000 probe
          docker run -d --name probe -p 6060:6060 -v "$PWD/probe:/data" nebenkostenfix:probe
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6060/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs probe; exit 1
      - name: Bauen und nach GHCR schieben (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.ABBILD }}:${{ env.VERSION }}
            ${{ env.ABBILD }}:${{ env.MINOR }}
            ${{ env.ABBILD }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          echo "- Docker: \`${ABBILD}:${VERSION}\`, \`:${MINOR}\` und \`:latest\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub-Release
    needs: [version, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.wert }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: nebenkostenfix-windows
          path: windows
      - name: Installer und Pruefsumme
        run: |
          exe="NebenkostenFix-${VERSION}-Setup.exe"
          cp "$(find windows -name "$exe" | head -n1)" "$exe"
          sha256sum "$exe" > SHA256SUMS.txt
          # NK-148: die Lizenztexte der mitgelieferten Software, erzeugt beim
          # Windows-Bau aus genau dieser Installation (Obermenge des Abbilds).
          lizenzen="$(find windows -name THIRD_PARTY_LICENSES.txt | head -n1)"
          if [ -z "$lizenzen" ]; then
            echo "::error::THIRD_PARTY_LICENSES.txt fehlt im Windows-Artefakt."
            exit 1
          fi
          cp "$lizenzen" THIRD_PARTY_LICENSES.txt
      # Ohne update.json saehe keine installierte App dieses Release, deshalb
      # bricht der Lauf ohne Secret ab. Der private Schluessel liegt nur dort.
      - name: Update-Manifest signieren
        env:
          UPDATE_SCHLUESSEL: ${{ secrets.UPDATE_SCHLUESSEL }}
        run: |
          if [ -z "$UPDATE_SCHLUESSEL" ]; then
            echo "::error::Secret UPDATE_SCHLUESSEL fehlt, ohne update.json kein Release."
            exit 1
          fi
          pip install --quiet cryptography==50.0.1
          umask 077
          printf '%s\n' "$UPDATE_SCHLUESSEL" > "$RUNNER_TEMP/herausgeber.pem"
          exe="NebenkostenFix-${VERSION}-Setup.exe"
          basis="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          python scripts/update_signieren.py manifest "$RUNNER_TEMP/herausgeber.pem" \
            --version "$VERSION" --installer "$exe" \
            --url "${basis}/download/v${VERSION}/${exe}" \
            --notizen "${basis}/tag/v${VERSION}" \
            --docker "${ABBILD}:${VERSION}" \
            --ausgabe update.json
          rm -f "$RUNNER_TEMP/herausgeber.pem"
          echo "- update.json: signiert" >> "$GITHUB_STEP_SUMMARY"
      - name: Release anlegen
        run: |
          exe="NebenkostenFix-${VERSION}-Setup.exe"
          dateien=("$exe" SHA256SUMS.txt THIRD_PARTY_LICENSES.txt)
          if [ -f update.json ]; then dateien+=(update.json); fi
          cat > notizen.md <<NOTIZ
          ## NebenkostenFix ${VERSION}

          **Windows:** \`${exe}\` herunterladen und ausführen (Windows 10 ab 1809, Windows 11).
          Ein bestehendes NebenkostenFix wird aktualisiert, die Daten bleiben.

          **Docker:**
          \`\`\`
          docker pull ${ABBILD}:${VERSION}
          \`\`\`
          oder in der Compose-Datei \`NK_VERSION=${VERSION}\` setzen und \`docker compose pull && docker compose up -d\`.

          **Prüfsumme (SHA256):** \`$(cut -d' ' -f1 SHA256SUMS.txt)\`

          ---

          NOTIZ
          # Was neu ist, steht im Repo und nicht in --generate-notes: das
          # erzeugt nur eine Zeile je Pull Request, haengt an dessen Labels
          # und schreibt "What's Changed" -- englisch, in einer deutschen App.
          cat "docs/release-notizen/${VERSION}.md" >> notizen.md
          # Die Vorversion ist die zuletzt veroeffentlichte; dieser Release
          # entsteht erst in der naechsten Zeile. Entwuerfe und Vorabversionen
          # zaehlen nicht. Der Vergleichslink ist Beiwerk: scheitert gh hier,
          # fehlt er, der Release entsteht trotzdem (das Abbild ist schon
          # gepusht, ein Abbruch liesse es ohne Release stehen).
          vorher=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty') || vorher=''
          if [ -n "$vorher" ]; then
            basis="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare"
            printf '\n---\n\n**Alle Änderungen im Einzelnen:** [%s...v%s](%s/%s...v%s)\n' \
              "$vorher" "$VERSION" "$basis" "$vorher" "$VERSION" >> notizen.md
          fi
          gh release create "v${VERSION}" "${dateien[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NebenkostenFix ${VERSION}" --notes-file notizen.md
          echo "- Release: v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  # Die Website liest Version und Neuerungen beim Deploy aus den Releases.
  # Ohne Anstoss kaeme die neue Version erst mit ihrem taeglichen Lauf
  # (04:17 UTC), der als Rueckfallnetz bleibt. WEBSITE_TOKEN: Fine-grained
  # Token nur fuer NebenkostenFix-Website, "Actions: Read and write"; der
  # GITHUB_TOKEN darf nicht in andere Repos. Fehlt das Token oder ist es
  # abgelaufen, gibt es nur eine Warnung, der Release bleibt gruen.
  website:
    name: Website aktualisieren
    needs: release
    if: github.repository == 'Nerbry72/NebenkostenFix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Deploy der Website anstossen
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WEBSITE_TOKEN fehlt, die Website folgt mit dem taeglichen Lauf."
            exit 0
          fi
          # Direkt per REST und mit fester ref: der Unterbefehl "workflow run" fragt per
          # GraphQL den Default-Branch ab, das darf das Token ohne Contents-Recht
          # nicht (beim Release 0.17.0 gescheitert).
          if gh api -X POST repos/Nerbry72/NebenkostenFix-Website/actions/workflows/deploy.yml/dispatches -f ref=main; then
            echo "- Website: Deploy angestossen" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Website-Anstoss gescheitert (Token abgelaufen?), die Website folgt mit dem taeglichen Lauf."
          fi

  # Die MSIX aus dem Bau geht als neue Einreichung in den Microsoft Store.
  # Die Zugangsdaten (Entra-App mit Manager-Rolle) liegen nur im Environment
  # "store", das nur main zulaesst. Danach zertifiziert der Store, das dauert
  # Stunden bis Tage. Ein offener Entwurf im Partner Center laesst die
  # Einreichung scheitern; Einreichungen per API nicht im Partner Center
  # weiterbearbeiten. Das Client-Secret laeuft nach spaetestens 24 Monaten ab.
  store:
    name: Microsoft Store
    needs: [version, release]
    if: github.repository == 'Nerbry72/NebenkostenFix'
    runs-on: windows-latest
    environment: store
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.wert }}
      MSSTORE_OUTPUT_STREAM: stdout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: nebenkostenfix-msix
          path: msix
      - uses: microsoft/microsoft-store-apppublisher@v1.4
        with:
          version: v0.4.3
      - name: Zugang einrichten
        shell: pwsh
        run: >-
          msstore reconfigure
          --tenantId "${{ secrets.PARTNER_CENTER_TENANT_ID }}"
          --sellerId "${{ secrets.PARTNER_CENTER_SELLER_ID }}"
          --clientId "${{ secrets.PARTNER_CENTER_CLIENT_ID }}"
          --clientSecret "${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}"
      # publish uebernaehme die Neuerungen der letzten Fassung. Deshalb erst
      # ein Entwurf (einen alten offenen loescht msstore selbst), dann die
      # Neuerungen aus eintrag-de.md, dann einreichen. Scheitert ein Schritt
      # danach, liegt der Entwurf im Partner Center: dort pruefen, einreichen.
      - name: Entwurf anlegen
        shell: pwsh
        run: |
          msstore publish "msix\NebenkostenFix-$env:VERSION.msix" -id 9PJQSSQGBNZ8 --noCommit
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Neuerungen setzen
        run: python scripts/store_neuerungen.py 9PJQSSQGBNZ8
      - name: Einreichen
        shell: pwsh
        run: |
          msstore submission publish 9PJQSSQGBNZ8
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "- Microsoft Store: NebenkostenFix-$env:VERSION.msix eingereicht, Zertifizierung laeuft" >> $env:GITHUB_STEP_SUMMARY
