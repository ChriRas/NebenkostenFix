# Rundgang als neuer Nutzer: startet NebenkostenFix mit leerem
# Datenordner und fährt mit Chromium durch alle Bereiche und Dialoge, in
# 1440, 768 und 390 px. Rot bei JS-Fehlern, CSP-Meldungen, Überlauf,
# abgeschnittenen Knöpfen und leeren Bereichen. Die Aufnahmen liegen im
# Artefakt, auch wenn der Lauf grün ist. Ohne Secrets, ohne echte Daten.
name: rundgang

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Neuer Push auf denselben Pull Request bricht den alten Lauf ab.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rundgang:
    name: Rundgang im Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # DOM-Rauchtest des Design-Systems (NK-067, F-108): ohne Browser, nur
      # Node, das der Runner mitbringt. Vorn, weil er in Sekunden fertig ist.
      - name: DOM-Rauchtest
        run: node scripts/rauchtest_design.js
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - name: Abhaengigkeiten
        run: |
          python -m pip install -r requirements.txt -r requirements-desktop.txt playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Rundgang
        # readme/: Bilder für docs/bilder und packaging/windows/store/bilder
        run: python scripts/rundgang.py --ausgabe rundgang-bilder --readme rundgang-bilder/readme
      - name: Aufnahmen ablegen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rundgang-bilder
          path: rundgang-bilder/
          retention-days: 14
