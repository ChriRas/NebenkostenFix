# Windows-Weg: die Testsuite auf windows-latest und der Bau der Desktop-App
# (PyInstaller + Inno Setup) samt Selbsttest, Update-Probe und Umzug
# Linux <-> Windows. Laeuft ohne Secrets und ohne echte Daten. Bei Pull
# Requests nach main. Das Release (release.yml) ruft nur den Bau auf
# (nur_paket), die Tests sind im Pull Request schon gelaufen.
name: windows

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      nur_paket:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# Neuer Push auf denselben Pull Request bricht den alten Lauf ab.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests auf Windows
    if: ${{ !inputs.nur_paket }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-desktop.txt
      - name: Abhaengigkeiten
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-desktop.txt
      - name: pytest
        env:
          PYTHONUTF8: '1'
        run: python -m pytest -q -p no:cacheprovider -o addopts="" --maxfail=50

  # NK-164: Umzugspaket ueber Plattformgrenzen. Linux baut ein .nkfix aus
  # einem fiktiven Bestand; der Windows-Job uebernimmt es aus den Quellen und
  # in der gebauten App und baut selbst eines, das Linux zuletzt uebernimmt.
  umzug-linux:
    name: Umzugspaket unter Linux bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Abhaengigkeiten
        run: python -m pip install -r requirements.txt
      - name: Paket bauen und unter Linux gegenpruefen
        run: |
          python scripts/umzug_kreuzprobe.py bauen --arbeit umzug --name linux
          python scripts/umzug_kreuzprobe.py pruefen --arbeit umzug-kontrolle --paket umzug/linux.nkfix --erwartet umzug/linux.json
      - uses: actions/upload-artifact@v7
        with:
          name: umzug-linux
          path: |
            umzug/linux.nkfix
            umzug/linux.json
          retention-days: 7

  paket:
    name: Desktop-App bauen und pruefen
    runs-on: windows-latest
    needs: umzug-linux
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - name: Abhaengigkeiten
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Lizenztexte der mitgelieferten Software (NK-148)
        run: python -m nebenkostenfix.drittlizenzen --ausgabe THIRD_PARTY_LICENSES.txt requirements.txt requirements-desktop.txt
      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = python -c "from nebenkostenfix.abrechnung_version import SOFTWARE_VERSION as v; print(v)"
          "wert=$v" >> $env:GITHUB_OUTPUT
          "## Windows-Paket $v" >> $env:GITHUB_STEP_SUMMARY
      - name: Selbsttest aus den Quellen
        shell: pwsh
        run: |
          python desktop.py --selbsttest --datenordner "$env:RUNNER_TEMP\nk-quelle2" --bericht "$env:RUNNER_TEMP\bericht-quelle.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: PyInstaller
        run: pyinstaller packaging/windows/nebenkosten.spec --noconfirm --distpath dist --workpath build
      - name: Paket pruefen (Fenster, Groesse, Selbsttest)
        shell: pwsh
        run: |
          $exe = "dist\NebenkostenFix\NebenkostenFix.exe"
          python packaging/windows/paketprobe.py fenster $exe; if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path dist\NebenkostenFix\_internal\THIRD_PARTY_LICENSES.txt)) { "THIRD_PARTY_LICENSES.txt fehlt im Paket"; exit 1 }
          python packaging/windows/paketprobe.py groesse dist\NebenkostenFix
          python packaging/windows/paketprobe.py selbsttest $exe "$env:RUNNER_TEMP\nk-paket" "$env:RUNNER_TEMP\bericht-paket.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/download-artifact@v8
        with:
          name: umzug-linux
          path: umzug-linux
      - name: Umzug Linux -> Windows (Quellen und gebaute App), Windows-Paket bauen
        shell: pwsh
        run: |
          python scripts/umzug_kreuzprobe.py pruefen --arbeit "$env:RUNNER_TEMP\umzug-quelle" --paket umzug-linux\linux.nkfix --erwartet umzug-linux\linux.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python packaging/windows/paketprobe.py umzug dist\NebenkostenFix\NebenkostenFix.exe umzug-linux\linux.nkfix umzug-linux\linux.json "$env:RUNNER_TEMP\nk-umzug" "$env:RUNNER_TEMP\bericht-umzug.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/umzug_kreuzprobe.py bauen --arbeit umzug-windows --name windows
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: umzug-windows
          path: |
            umzug-windows/windows.nkfix
            umzug-windows/windows.json
          retention-days: 7
      - name: WebView2-Bootstrapper holen
        id: webview2
        shell: pwsh
        continue-on-error: true
        run: |
          $ziel = "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $ziel
          "pfad=$ziel" >> $env:GITHUB_OUTPUT
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $argumente = @("/DAppVersion=${{ steps.version.outputs.wert }}")
          if ("${{ steps.webview2.outputs.pfad }}") { $argumente += "/DWebView2Bootstrapper=${{ steps.webview2.outputs.pfad }}" }
          & $iscc @argumente packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Eine "Vorversion" fuer die Update-Probe (NK-081, D-95): dasselbe
          # Paket unter den Namen vor der Umbenennung (Exe, Programm- und
          # Datenordner "Nebenkostenabrechnung"), gleiche AppId, kleinere Nummer.
          $alt = "$env:RUNNER_TEMP\alt\Nebenkostenabrechnung"
          New-Item -ItemType Directory -Force -Path (Split-Path $alt) | Out-Null
          Copy-Item -Recurse dist\NebenkostenFix $alt
          Rename-Item "$alt\NebenkostenFix.exe" "Nebenkostenabrechnung.exe"
          & $iscc "/DAppVersion=0.0.1" "/DAppName=Nebenkostenabrechnung" "/DAppExe=Nebenkostenabrechnung.exe" "/DOrdner=Nebenkostenabrechnung" "/DQuelle=$alt" "/FVorversion-Setup" "/O$env:RUNNER_TEMP" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $setup = Get-Item "dist\NebenkostenFix-*-Setup.exe"
          "- Installer: $($setup.Name), $([math]::Round($setup.Length / 1MB, 1)) MB" >> $env:GITHUB_STEP_SUMMARY
      - name: Vorversion (vor der Umbenennung) installieren, Update darueber, deinstallieren
        # Dauert sonst unter einer Minute. Ein haengender Installer soll nicht
        # die 40 Minuten des Jobs verbrauchen (PR #12, 2026-09-30); er hing
        # mehrfach, daher 5 statt 10 Minuten; 7 seit der zweiten Deinstallation (#45).
        timeout-minutes: 7
        shell: pwsh
        run: |
          $programm = "$env:ProgramFiles\Nebenkostenabrechnung"
          $daten = [Environment]::GetFolderPath('MyDocuments') + "\Nebenkostenabrechnung"
          # 1. Vorversion installieren und Daten anlegen
          python packaging/windows/paketprobe.py installieren "$env:RUNNER_TEMP\Vorversion-Setup.exe" "$env:RUNNER_TEMP\installation-vorversion.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP\installation-vorversion.log"; exit 1 }
          $ini = "$env:LOCALAPPDATA\Nebenkostenabrechnung\einstellungen.ini"
          if (-not (Test-Path $ini)) { "einstellungen.ini der Vorversion fehlt"; exit 1 }
          Get-Content $ini
          python packaging/windows/paketprobe.py selbsttest "$programm\Nebenkostenabrechnung.exe" $daten "$env:RUNNER_TEMP\bericht-vorversion.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $vorher = (Get-FileHash "$daten\nebenkosten.db").Hash
          # 2. NebenkostenFix darueber (Update, NK-081): gleiche AppId, Programmordner bleibt
          $setup = (Get-Item "dist\NebenkostenFix-*-Setup.exe").FullName
          python packaging/windows/paketprobe.py installieren $setup "$env:RUNNER_TEMP\installation.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP\installation.log"; exit 1 }
          if (-not (Test-Path "$programm\NebenkostenFix.exe")) { "NebenkostenFix.exe fehlt nach dem Update"; exit 1 }
          if (Test-Path "$programm\Nebenkostenabrechnung.exe") { "alte Exe liegt noch da"; exit 1 }
          "- Update ersetzt die alte Exe, Programmordner bleibt" >> $env:GITHUB_STEP_SUMMARY
          python packaging/windows/paketprobe.py update $daten $vorher "${{ steps.version.outputs.wert }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # D-95: die App nimmt weiter den alten Datenordner
          python packaging/windows/paketprobe.py datenordner "$programm\NebenkostenFix.exe" $daten "$env:RUNNER_TEMP\bericht-datenordner.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 3. Die aktualisierte App laeuft (frischer Datenordner, die alten Daten bleiben unberuehrt)
          python packaging/windows/paketprobe.py selbsttest "$programm\NebenkostenFix.exe" "$env:RUNNER_TEMP\nk-nach-update" "$env:RUNNER_TEMP\bericht-installiert.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 4. Deinstallation laesst die Daten stehen, ohne /EINSTELLUNGEN=1 auch
          #    Serveradresse und WebView2-Profil (#45)
          python packaging/windows/paketprobe.py lokale-reste
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python packaging/windows/paketprobe.py deinstallieren $programm $daten behalten
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 5. Neu installieren, still mit /EINSTELLUNGEN=1 deinstallieren: [Server]
          #    und WebView2 weg; [Daten], Datenordner und lokaler Ausweich "Daten" bleiben.
          #    Ohne Uninstall-Eintrag geht das Programm in den Vorgabeordner.
          python packaging/windows/paketprobe.py installieren $setup "$env:RUNNER_TEMP\installation-neu.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP\installation-neu.log"; exit 1 }
          python packaging/windows/paketprobe.py deinstallieren "$env:ProgramFiles\NebenkostenFix" $daten entfernen
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: MSIX fuer den Store packen (NK-173)
        id: msix
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.wert }}"
          python packaging/windows/msix.py vorbereiten dist\NebenkostenFix "$env:RUNNER_TEMP\msix-inhalt" $v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Neuestes Windows SDK auf dem Runner (makeappx, signtool)
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $makeappx) { "makeappx.exe nicht gefunden"; exit 1 }
          $datei = "dist\NebenkostenFix-$v.msix"
          & $makeappx.FullName pack /d "$env:RUNNER_TEMP\msix-inhalt" /p $datei /o
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "sdk=$($makeappx.DirectoryName)" >> $env:GITHUB_OUTPUT
          "datei=$datei" >> $env:GITHUB_OUTPUT
          "- MSIX: $(Split-Path $datei -Leaf), $([math]::Round((Get-Item $datei).Length / 1MB, 1)) MB, unsigniert (signiert der Store)" >> $env:GITHUB_STEP_SUMMARY
      - name: MSIX testsigniert installieren, starten, entfernen (F-102)
        # Nur die Probe: das hochgeladene Paket bleibt unsigniert.
        timeout-minutes: 10
        shell: pwsh
        run: |
          # Testzertifikat mit dem Publisher aus dem Partner Center, so bleibt
          # die Paketfamilie dieselbe wie im Store.
          $zert = New-SelfSignedCertificate -Type Custom -Subject "CN=5A9DC20D-397B-41AF-807A-57E2A97CF70C" `
            -KeyUsage DigitalSignature -FriendlyName "NebenkostenFix CI-Test" -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-Certificate -Cert $zert -FilePath "$env:RUNNER_TEMP\msix-test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\msix-test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $test = "$env:RUNNER_TEMP\NebenkostenFix-test.msix"
          Copy-Item "${{ steps.msix.outputs.datei }}" $test
          & "${{ steps.msix.outputs.sdk }}\signtool.exe" sign /fd SHA256 /sha1 $zert.Thumbprint /s My $test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Reste der Installer-Proben wuerden die Umleitung verdecken
          Remove-Item "$env:LOCALAPPDATA\NebenkostenFix" -Recurse -Force -ErrorAction SilentlyContinue
          Add-AppxPackage -Path $test
          $paket = Get-AppxPackage -Name NerbrY72.NebenkostenFix
          if (-not $paket) { "MSIX nicht installiert"; exit 1 }
          "- MSIX installiert: $($paket.PackageFullName)" >> $env:GITHUB_STEP_SUMMARY
          $daten = "$env:RUNNER_TEMP\nk-msix"
          # Start ueber den Alias, also mit Paketidentitaet
          python packaging/windows/paketprobe.py msix "$env:LOCALAPPDATA\Microsoft\WindowsApps\NebenkostenFix.exe" $paket.PackageFamilyName $daten $env:RUNNER_TEMP
          $ok = $LASTEXITCODE
          Remove-AppxPackage -Package $paket.PackageFullName
          python packaging/windows/paketprobe.py msix-entfernt $paket.PackageFamilyName $daten
          if ($ok -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: nebenkostenfix-msix
          path: dist/NebenkostenFix-*.msix
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nebenkostenfix-windows
          path: |
            dist/NebenkostenFix-*-Setup.exe
            THIRD_PARTY_LICENSES.txt
            ${{ runner.temp }}/bericht-*.json
            ${{ runner.temp }}/installation*.log
          retention-days: 14
          if-no-files-found: warn

  umzug-zurueck:
    name: Umzug Windows -> Linux
    if: ${{ !inputs.nur_paket }}
    runs-on: ubuntu-latest
    needs: paket
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Abhaengigkeiten
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: umzug-windows
          path: umzug-windows
      - name: Windows-Paket unter Linux uebernehmen
        run: python scripts/umzug_kreuzprobe.py pruefen --arbeit umzug-ziel --paket umzug-windows/windows.nkfix --erwartet umzug-windows/windows.json
